name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'VirtRigaud release tag to document (e.g. v1.2.3). Defaults to the tag in VIRTRIGAUD_VERSION.'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select VirtRigaud release to document
        id: virtrigaud
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # workflow_dispatch input wins; otherwise the tag pinned in VIRTRIGAUD_VERSION.
          # Never fall back to the default branch: unreleased behaviour must not reach the site.
          ref="$INPUT_VERSION"
          if [ -z "$ref" ]; then ref="$(tr -d '[:space:]' < VIRTRIGAUD_VERSION)"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Documenting VirtRigaud $ref"

      - name: Checkout VirtRigaud repository
        uses: actions/checkout@v6
        with:
          repository: projectbeskar/virtrigaud
          path: virtrigaud
          # Release tag selected above (input or VIRTRIGAUD_VERSION).
          ref: ${{ steps.virtrigaud.outputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # 1.26+ required: virtrigaud's go.mod was bumped to `go 1.26.0`
          # in PR projectbeskar/virtrigaud#125 (v0.3.6). The crd-ref-docs
          # step below clones that repo and runs `go` against it, so the
          # toolchain here must satisfy the require directive. setup-go@v6
          # defaults GOTOOLCHAIN=local, so we cannot rely on auto-download
          # of a newer toolchain — pin to a version that meets the floor.
          go-version: '1.26'

      - name: Install Go documentation tools
        run: |
          go install github.com/elastic/crd-ref-docs@latest
          go install github.com/bufbuild/buf/cmd/buf@latest
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate CRD documentation
        run: ./tools/gen-crd-docs.sh virtrigaud

      - name: Generate proto/gRPC API documentation
        run: ./tools/gen-proto-docs.sh virtrigaud

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Build documentation
        run: poetry run mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

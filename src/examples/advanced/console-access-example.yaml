# VM Console Access Example
# Demonstrates status.consoleURL:
# - vSphere: a link to the VM in the vSphere Client (open it, sign in, launch the console)
# - libvirt: a vnc:// URL for the VM's VNC display, which listens on the libvirt host's
#   loopback only (reach it through an SSH tunnel)

---
# vSphere Provider Configuration
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: vsphere-prod
  namespace: default
spec:
  type: vsphere
  endpoint: https://vcenter.example.com/sdk
  credentialSecretRef:
    name: vsphere-credentials
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-vsphere:v0.4.0"
    service:
      port: 9090
      # A Provider with NO tls block fails to reconcile (TLSConfigured=False, Reason=TLSBlockMissing).
      # Set tls.enabled: false only to keep plaintext (dev/lab).
      tls:
        enabled: true
        secretRef:
          name: provider-vsphere-tls   # Secret with tls.crt, tls.key, ca.crt
        insecureSkipVerify: false
  defaults:
    datastore: "datastore1"
    cluster: "cluster1"

---
# Libvirt Provider Configuration
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: libvirt-local
  namespace: default
spec:
  type: libvirt
  endpoint: "qemu:///system"
  credentialSecretRef:
    name: libvirt-credentials
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-libvirt:v0.4.0"
    service:
      port: 9090
      # A Provider with NO tls block fails to reconcile (TLSConfigured=False, Reason=TLSBlockMissing).
      # Set tls.enabled: false only to keep plaintext (dev/lab).
      tls:
        enabled: true
        secretRef:
          name: provider-libvirt-tls   # Secret with tls.crt, tls.key, ca.crt
        insecureSkipVerify: false
  defaults:
    network: "default"

---
# VMClass for console demos
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: console-demo
  namespace: default
spec:
  cpu: 2
  memory: "4Gi"
  diskDefaults:
    type: thin
    size: "50Gi"

---
# vSphere VMImage
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMImage
metadata:
  name: ubuntu-vsphere
  namespace: default
spec:
  source:
    vsphere:
      templateName: "ubuntu-22.04-template"

---
# Libvirt VMImage
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMImage
metadata:
  name: ubuntu-libvirt
  namespace: default
spec:
  source:
    libvirt:
      url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
      format: qcow2
      checksum: "sha256:REPLACE_WITH_REAL_SHA256"
      checksumType: sha256

---
# Example 1: vSphere VM with Web Console Access
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: vsphere-console-demo
  namespace: default
  annotations:
    description: "VM with vSphere web console access"
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: console-demo
  imageRef:
    name: ubuntu-vsphere

  powerState: "On"
  
  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: vsphere-console
        
        users:
          - name: admin
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            ssh_authorized_keys:
              - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC...
        
        packages:
          - open-vm-tools
        
        runcmd:
          - systemctl enable open-vm-tools
          - systemctl start open-vm-tools

---
# Example 2: Libvirt VM with VNC Console Access
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: libvirt-console-demo
  namespace: default
  annotations:
    description: "VM with VNC console access"
spec:
  providerRef:
    name: libvirt-local
  classRef:
    name: console-demo
  imageRef:
    name: ubuntu-libvirt

  powerState: "On"
  
  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: libvirt-console
        
        users:
          - name: admin
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            password: '$6$rounds=4096$saltsalt$hashed_password'
            chpasswd: { expire: False }
        
        packages:
          - qemu-guest-agent
        
        runcmd:
          - systemctl enable qemu-guest-agent
          - systemctl start qemu-guest-agent

---
# Console Access Guide
#
# status.consoleURL is filled from the provider's Describe answer on each reconcile.
#
# vSphere: a link to the VM's summary page in the vSphere Client (the provider
#   builds it from the Provider endpoint, the VM's id and instance UUID). Open it
#   in a browser, sign in to vCenter, and launch the web or remote console from
#   that page. VirtRigaud does not open a console session itself.
#     kubectl get vm vsphere-console-demo -o jsonpath='{.status.consoleURL}'
#
# libvirt: vnc://<libvirt host>:<port>, set only while the VM is powered on. The
#   provider defines every domain with a VNC display on an automatically chosen
#   port that listens on 127.0.0.1 of the libvirt host ONLY. The URL is therefore
#   not reachable from other machines: forward the port over SSH and connect to
#   the local end. Read the port from the URL (it is not always 5900).
#     URL=$(kubectl get vm libvirt-console-demo -o jsonpath='{.status.consoleURL}')
#     PORT=${URL##*:}
#     ssh -L ${PORT}:127.0.0.1:${PORT} user@libvirt-host.example.com
#     vncviewer localhost:${PORT}        # in another terminal
#   Do not open the VNC port in a firewall or put it behind a public proxy: the
#   display has no password.
#
# Troubleshooting:
#   - Empty consoleURL on vSphere: the VM is not created yet, or the Provider
#     endpoint is not set. Check `kubectl get vm <name> -o jsonpath='{.status.phase}'`
#     and the provider log (kubectl logs -l app.kubernetes.io/instance=<provider>).
#   - Empty consoleURL on libvirt: the VM is powered off, or the provider could
#     not read the domain's VNC port.
#   - Connection refused on libvirt: the tunnel is not up, or the VM is off.

# vSphere Long-Running Operations Example
# Shows how to follow slow vSphere operations (a large create, a reconfigure).
#
# How it works in v0.4.0:
# - The vSphere provider waits for each vCenter task inside the gRPC call and
#   answers without a task reference, so there is no per-task progress
#   percentage. (Providers whose operations return a task, such as Proxmox for
#   power operations, are polled by the manager through the TaskStatus RPC;
#   the task id is recorded in status.lastTaskRef.)
# - While an operation runs, the VirtualMachine shows it in status.phase
#   (Provisioning, Reconfiguring) and in its conditions; the outcome is in the
#   conditions, the events and the provider log. vCenter's Tasks & Events view
#   has the task itself.
# - The manager gives a Create call 5 minutes; a failed or timed-out call is
#   retried, or the VM is held (see the Advanced VM lifecycle guide).

---
# Provider configuration
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: vsphere-prod
  namespace: default
spec:
  type: vsphere
  endpoint: https://vcenter.example.com/sdk
  credentialSecretRef:
    name: vsphere-credentials
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-vsphere:v0.4.0"
    service:
      port: 9090
      # A Provider with NO tls block fails to reconcile (TLSConfigured=False, Reason=TLSBlockMissing).
      # Set tls.enabled: false only to keep plaintext (dev/lab).
      tls:
        enabled: true
        secretRef:
          name: provider-vsphere-tls   # Secret with tls.crt, tls.key, ca.crt
        insecureSkipVerify: false
  defaults:
    datastore: "datastore1"
    cluster: "cluster1"

---
# VMClass with larger resources to trigger longer operations
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: large-vm
  namespace: default
spec:
  cpu: 16
  memory: "64Gi"
  diskDefaults:
    type: thin
    size: "500Gi"  # Larger disk for longer provisioning time

---
# VMImage
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMImage
metadata:
  name: rhel-8-template
  namespace: default
spec:
  source:
    vsphere:
      templateName: "rhel-8.8-template"

---
# VMNetworkAttachment
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMNetworkAttachment
metadata:
  name: prod-network
  namespace: default
spec:
  network:
    vsphere:
      portgroup: "Production Network"

---
# Example 1: a long-running create
# A large clone from a template can take several minutes
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: database-server
  namespace: default
  annotations:
    description: "Large database server"
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: large-vm
  imageRef:
    name: rhel-8-template
  networks:
    - name: prod-network
      networkRef:
        name: prod-network

  powerState: "On"

  placement:
    datastore: "datastore1"
    cluster: "cluster1"
    resourcePool: "Production"

  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: database-server

        packages:
          - postgresql-server
          - postgresql-contrib

        runcmd:
          - postgresql-setup --initdb
          - systemctl enable postgresql
          - systemctl start postgresql

---
# Example 2: a VM to reconfigure
# A change of its effective CPU or memory triggers a Reconfigure
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: app-server
  namespace: default
spec:
  providerRef:
    name: vsphere-prod

  # Start with smaller resources
  classRef:
    name: large-vm  # Change the class, or set spec.resources, to trigger a Reconfigure

  imageRef:
    name: rhel-8-template
  networks:
    - name: prod-network
      networkRef:
        name: prod-network

  powerState: "On"

---
# Following an operation
#
# 1. Phase and conditions:
#      kubectl get vm database-server -w
#      kubectl get vm database-server \
#        -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}'
#
# 2. Events:
#      kubectl get events --field-selector involvedObject.name=database-server
#
# 3. Provider log (the Deployment is named virtrigaud-provider-<namespace>-<name>):
#      kubectl logs -f deployment/virtrigaud-provider-default-vsphere-prod
#
# 4. vCenter: Menu > Tasks & Events > Tasks, filtered to recent tasks.

---
# Advanced: Parallel Operations
# Several VMs can be created at the same time; each has its own status
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: worker-01
  namespace: default
  labels:
    role: worker
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: large-vm
  imageRef:
    name: rhel-8-template
  networks:
    - name: prod-network
      networkRef:
        name: prod-network
  powerState: "On"

---
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: worker-02
  namespace: default
  labels:
    role: worker
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: large-vm
  imageRef:
    name: rhel-8-template
  networks:
    - name: prod-network
      networkRef:
        name: prod-network
  powerState: "On"

---
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: worker-03
  namespace: default
  labels:
    role: worker
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: large-vm
  imageRef:
    name: rhel-8-template
  networks:
    - name: prod-network
      networkRef:
        name: prod-network
  powerState: "On"

---
# Usage Instructions:
#
# 1. Deploy resources:
#    kubectl apply -f vsphere-task-tracking.yaml
#
# 2. Monitor all VMs at once:
#    watch -n 2 'kubectl get vm'
#
# 3. Trigger a reconfiguration (the class must exist; a running vSphere VM takes
#    a CPU or memory change only with hot-add enabled on the VMClass, otherwise
#    the VM shows Reconfiguring=False / ResizePendingPowerOff until it is powered off):
#    kubectl patch vm app-server --type='merge' -p='{"spec":{"resources":{"cpu":8,"memoryMiB":32768}}}'

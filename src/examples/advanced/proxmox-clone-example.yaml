# Proxmox VMClone Example
#
# Demonstrates the VMClone CRD cloning an existing, provisioned VirtualMachine
# into a new one on the SAME Proxmox provider. Proxmox serves FULL clones only
# (since v0.4.1 it no longer advertises linked clones, and a LinkedClone
# VMClone fails with reason LinkedCloneUnsupported). libvirt serves full
# clones only too; vSphere serves both.
#
# Scope:
#   - source.vmRef only (snapshotRef/templateRef/imageRef -> Phase=Failed)
#   - same-provider clone (the produced VM lives on the source VM's provider)
#   - FullClone only on Proxmox (LinkedClone requires the provider to report
#     SupportsLinkedClones=true, which Proxmox does not)
# The controller creates the target VirtualMachine CR named spec.target.name
# BEFORE the Clone (its UID goes to the provider as the clone's owner stamp),
# seeds its Status.ID with the provider's cloned VM ID, and labels it
# virtrigaud.io/adopted=true so the VirtualMachine controller adopts the clone
# instead of creating a second VM. Deleting the VMClone does NOT delete the
# produced VM. A clone is left powered off unless spec.options.powerOn: true.

---
# Provider (Proxmox VE)
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: proxmox-prod
  namespace: default
spec:
  type: proxmox
  endpoint: https://pve.example.com:8006/api2/json
  credentialSecretRef:
    name: proxmox-credentials
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-proxmox:v0.4.2"
    service:
      port: 9443
      # A Provider with NO tls block fails to reconcile (TLSConfigured=False, Reason=TLSBlockMissing).
      # Set tls.enabled: false only to keep plaintext (dev/lab).
      tls:
        enabled: true
        secretRef:
          name: provider-proxmox-tls   # Secret with tls.crt, tls.key, ca.crt
        insecureSkipVerify: false

---
# VMClass for the source/target VMs
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: small
  namespace: default
spec:
  cpu: 2
  memory: "4Gi"
  diskDefaults:
    type: thin
    size: "40Gi"

---
# Source VirtualMachine (must be provisioned — i.e. have a populated Status.ID —
# before the VMClone can proceed; otherwise the clone stays Phase=Pending).
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: app-golden
  namespace: default
spec:
  providerRef:
    name: proxmox-prod
  classRef:
    name: small
  imageRef:
    name: ubuntu-24-04
  powerState: "Off"

---
# Example 1: Full clone
# An independent copy with its own storage. Use for long-lived workloads.
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClone
metadata:
  name: app-clone-full
  namespace: default
spec:
  source:
    vmRef:
      name: app-golden
  target:
    name: app-prod-01
    classRef:
      name: small
    labels:
      app: app-prod
  options:
    type: FullClone   # default

---
# Example 2: Full clone with user-data of its own
# A Proxmox clone does NOT carry its source's user-data. A clone of a VM that has
# a cloud-init seed (or a VMClone with inline user-data, as here) gets a seed of
# its own: a new instance-id, its own hostname, and this user-data. Without inline
# user-data the clone's seed configures nothing. Give the clone the users, keys and
# sudo rules it must have. The Provider's Secret needs the SSH keys for this (see
# secrets/proxmox-creds.yaml) and the clone must stay on the node SSH reaches.
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClone
metadata:
  name: app-clone-userdata
  namespace: default
spec:
  source:
    vmRef:
      name: app-golden
  target:
    name: app-dev-01
    classRef:
      name: small
  options:
    type: FullClone
  customization:
    hostname: app-dev-01
    userData:
      cloudInit:
        inline: |
          #cloud-config
          users:
            - default
            - name: ops
              shell: /bin/bash
              ssh_authorized_keys:
                - ssh-ed25519 AAAA... ops@example.com

# Usage:
#
# 1. Apply the source first and wait until it is provisioned:
#      kubectl apply -f proxmox-clone-example.yaml
#      kubectl get vm app-golden -o jsonpath='{.status.id}'   # must be non-empty
#
# 2. Watch the clones progress (Pending -> Cloning -> Ready):
#      kubectl get vmclone -w
#      kubectl get vmclone app-clone-full -o jsonpath='{.status.phase}'
#
# 3. The produced VMs (app-prod-01, app-dev-01) appear as VirtualMachine CRs,
#    adopted (virtrigaud.io/adopted=true) with Status.ID already seeded:
#      kubectl get vm app-prod-01 -o jsonpath='{.status.id}'
#      kubectl get vmclone app-clone-full -o jsonpath='{.status.targetVMID}'
#
# 4. Deleting a VMClone does NOT delete the produced VM:
#      kubectl delete vmclone app-clone-full   # app-prod-01 remains
#
# Notes:
# - Proxmox: a LinkedClone VMClone is refused before the provider is called
#   (Phase=Failed, reason LinkedCloneUnsupported); the clone also gets the
#   VMClass's CPU and memory (v0.4.1). Do not delete a VMClone or its target
#   while it is still cloning: the VM PVE finishes stays on PVE.
# - libvirt: LinkedClone is disabled (Phase=Failed, reason LinkedCloneUnsupported);
#   a FullClone needs the source VM powered off (it waits Pending with reason
#   SourceMustBePoweredOff otherwise). See docs/libvirt-clones.md.
# - Cross-provider cloning is not supported (same-provider only); use a
#   VMMigration to move a VM between providers.

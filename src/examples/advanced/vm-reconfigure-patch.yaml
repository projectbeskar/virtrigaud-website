# VM Reconfiguration Example
# This patch demonstrates how to modify a VM's resources after creation
# Apply this after the initial VM is running to trigger reconfiguration
#
# NOTE — Libvirt online reconfigure:
#   For CPU/memory changes to apply WITHOUT a power cycle on Libvirt/KVM, the VM
#   must have been CREATED from a VMClass with cpuHotAddEnabled: true and/or
#   memoryHotAddEnabled: true. The new values must also fall within the 4×
#   ceiling provisioned at create time (vCPU ceiling is hard-capped at 64), and a
#   memory shrink of a running VM never applies live. If a condition is not met,
#   the change is written to the persistent definition only: the VM reports
#   Reconfiguring=True / RestartRequired until it is power cycled (off, then on).
#   The controller never powers a VM off by itself.
#   For disk expansion: Libvirt grows the primary disk live via virsh blockresize
#   (grow-only). A best-effort in-guest FS grow runs via the guest agent; if the
#   guest agent is absent the block device is enlarged but the filesystem must be
#   extended manually or via cloud-init.
# NOTE — vSphere: a powered-on VM takes a CPU or memory change only with the
#   matching hot-add enabled on the VMClass (performanceProfile); otherwise the
#   change is refused with Reconfiguring=False / ResizePendingPowerOff and is
#   applied after you set spec.powerState: "Off". vSphere never resizes the root disk.
# NOTE — Proxmox: CPU and memory changes are sent to PVE; a change PVE keeps pending
#   (hot-plug not enabled for it) is currently reported as applied.

---
# Upgrade web-server-01 resources.
# Apply with: kubectl patch vm web-server-01 --patch-file vm-reconfigure-patch.yaml --type merge
# A merge patch only needs spec.resources; providerRef, classRef and imageRef
# (unchanged from vm-reconfigure-and-snapshot.yaml) keep this file a complete,
# valid VirtualMachine as well.
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: web-server-01
  namespace: default
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: web-server-small
  imageRef:
    name: ubuntu-22-server

  # Increase CPU and memory
  resources:
    cpu: 4            # Upgrade from 2 to 4 CPUs
    memoryMiB: 8192    # Upgrade from 4096 MiB (4Gi) to 8192 MiB (8Gi)

  # Expand the data disk (vSphere only: the libvirt and Proxmox providers attach no
  # spec.disks and report DisksApplied=False / NotSupportedByProvider). Only a disk
  # that was attached at create can grow; an entry added later is not attached, and a
  # smaller size is refused. Disk sizes travel with a CPU or memory change, which this
  # patch also makes: a disk-size change alone does not trigger a Reconfigure.
  disks:
    - name: "data"
      sizeGiB: 100    # Expand from 50GB to 100GB
      type: "thin"

# The controller detects any change between the VM's effective resources
# (this VMClass with spec.resources applied on top, field by field — an
# override outside the VMClass's own CPU/memory bounds is refused with
# Reconfiguring=False/ValidationError and never sent to the provider) and
# status.currentResources, then sends ONE Reconfigure request per provider
# reconcile:
# 1. The provider applies what it can online (see the notes above).
# 2. On libvirt, anything that cannot be applied online is written to the VM's
#    persistent definition instead and takes effect on its next power cycle —
#    the controller does NOT power the VM off and back on for you. The VM
#    reports Reconfiguring=True / RestartRequired until it has been power cycled.
# 3. status.currentResources, status.lastReconfigureTime and the
#    Reconfiguring condition are updated once the provider confirms the
#    request — never before, and never to a size that was not actually sent.

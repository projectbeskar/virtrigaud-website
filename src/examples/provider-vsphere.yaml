# vSphere Provider Example
# This example demonstrates Remote provider configuration for VMware vSphere
#
# ⚠️  IMPORTANT: Requires Active vSphere Environment  
# The vSphere provider needs access to vCenter Server or ESXi hosts.
# See docs/providers/vsphere.md for setup instructions and configuration details.
#
# Required vCenter privilege: the account in credentialSecretRef needs
# "Virtual machine > Change Configuration > Advanced configuration"
# (VirtualMachine.Config.AdvancedConfig) on the target VM folder and resource
# pool. Every create writes an ExtraConfig owner stamp and fails without it.
# VMImage templateName must name a real vSphere template (not a regular VM).
# See docs/vm-ownership.md.

apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: vsphere-prod
  namespace: default
spec:
  type: vsphere
  endpoint: https://vcenter.example.com/sdk
  credentialSecretRef:
    name: vsphere-creds
  insecureSkipVerify: false
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-vsphere:v0.4.1"
    service:
      port: 9090
      # A Provider with NO tls block fails to reconcile (TLSConfigured=False, Reason=TLSBlockMissing).
      # Set tls.enabled: false only to keep plaintext (dev/lab).
      tls:
        enabled: true
        secretRef:
          name: provider-vsphere-tls   # Secret with tls.crt, tls.key, ca.crt
        insecureSkipVerify: false
  defaults:
    datastore: datastore1
    cluster: compute-cluster-a
    folder: virtrigaud-vms

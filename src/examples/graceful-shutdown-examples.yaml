# Cross-namespace references: the VirtualMachines below live in `default` and
# reference a Provider, VMClass and VMImage in `virtrigaud-system`. Each of
# those objects must share itself with `default` via
# spec.consumerNamespaceSelector, or the VMs report Ready=False /
# ConsumerNotAllowed and nothing is created. On each of them (none is defined
# here), add for example:
#   consumerNamespaceSelector:
#     matchLabels:
#       kubernetes.io/metadata.name: default
# See docs/cross-namespace-references.md.

apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: graceful-shutdown-example
  namespace: default
spec:
  # Use graceful shutdown power state
  powerState: "OffGraceful"
  
  providerRef:
    name: vsphere-provider
    namespace: virtrigaud-system
  
  classRef:
    name: small-vm
    namespace: virtrigaud-system
  
  imageRef:
    name: ubuntu-22-04
    namespace: virtrigaud-system
  
  networks:
    - name: default-network
  
  # The lifecycle block below only shows the schema.
  # NOTE: spec.lifecycle hooks and gracefulShutdownTimeout are accepted by the API but not
  # executed or sent to the provider in v0.4.2 (see the "Advanced VM lifecycle" guide).
  lifecycle:
    gracefulShutdownTimeout: "90s"  # 90 seconds for graceful shutdown
    
    # Pre-stop hook (accepted by the API, not executed)
    preStop:
      exec:
        command:
          - "/bin/bash"
          - "-c"
          - |
            # Save any important data
            sync
            # Notify applications to shutdown gracefully
            systemctl stop my-application || true
            # Wait a moment for cleanup
            sleep 5

---
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: regular-shutdown-example
  namespace: default
spec:
  # Regular hard shutdown
  powerState: "Off"
  
  providerRef:
    name: vsphere-provider
    namespace: virtrigaud-system
  
  classRef:
    name: small-vm
    namespace: virtrigaud-system
  
  imageRef:
    name: ubuntu-22-04
    namespace: virtrigaud-system
  
  networks:
    - name: default-network
